name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The suite deliberately fakes /proc and hyprctl, so it runs on a
      # runner with no compositor.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy hyprpages
      - run: pytest
      # A subcommand that never runs is a subcommand that silently broke.
      - name: CLI smoke test
        run: |
          hyprpages --version
          for c in state capture move apps launch focus page apply; do
            hyprpages "$c" --help > /dev/null
          done
