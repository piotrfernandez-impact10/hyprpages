name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The suite deliberately fakes /proc and hyprctl, so it runs on a
      # runner with no compositor.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy hypr_spaces
      - run: pytest
